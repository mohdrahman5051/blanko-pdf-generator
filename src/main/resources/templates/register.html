<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Register | Blanko</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
    linear-gradient(
    135deg,
    #8B445C,
    #A38893,
    #EBD7CE);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;

}

.card{

    width:950px;

    display:grid;

    grid-template-columns:1fr 1fr;

    border-radius:30px;

    overflow:hidden;

    background:
    rgba(255,255,255,.18);

    backdrop-filter:blur(18px);

    box-shadow:
    0 25px 60px
    rgba(0,0,0,.18);

}

.left{

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    padding:60px;

}

.left .logo{

    font-size:72px;

    margin-bottom:25px;

}

.left h1{

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:64px;

    letter-spacing:4px;

    margin-bottom:15px;

}

.left p{

    line-height:1.8;

    opacity:.95;

}

.right{

    background:white;

    padding:55px;

}

.right h2{

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:44px;

    color:#4C3342;

    margin-bottom:35px;

}

input{

    width:100%;

    padding:15px 18px;

    margin-bottom:18px;

    border-radius:30px;

    border:2px solid #DDD;

    font-size:15px;

    outline:none;

    transition:.25s;

}

input:focus{

    border-color:#8B445C;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:30px;

    background:#4C3342;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#8B445C;

    transform:translateY(-2px);

}

.bottom{

    margin-top:22px;

    text-align:center;

}

.bottom a{

    color:#8B445C;

    text-decoration:none;

    font-weight:600;

}

.toast{

    position:fixed;

    top:25px;

    right:25px;

    padding:16px 24px;

    border-radius:12px;

    color:white;

    font-weight:500;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.18);

    animation:
    slideIn .35s ease,
    fadeOut .5s ease
    3s forwards;

    z-index:999;

}

.success{

    background:#2E8B57;

}

.error{

    background:#C0392B;

}

@keyframes slideIn{

    from{

        opacity:0;

        transform:
        translateX(120px);

    }

    to{

        opacity:1;

        transform:
        translateX(0);

    }

}

@keyframes fadeOut{

    to{

        opacity:0;

        transform:
        translateX(120px);

    }

}

@media(max-width:900px){

.card{

grid-template-columns:1fr;

}

.left,
.right{

padding:35px;

}

.left h1{

font-size:48px;

}

.right h2{

font-size:36px;

}

}

</style>

</head>

<body>

    <!-- ========================= -->
<!-- TOAST NOTIFICATIONS -->
<!-- ========================= -->

<div th:if="${success}" class="toast success">
    <span th:text="${success}"></span>
</div>

<div th:if="${error}" class="toast error">
    <span th:text="${error}"></span>
</div>

<!-- ========================= -->
<!-- MAIN CARD -->
<!-- ========================= -->

<div class="card">

    <!-- LEFT PANEL -->

    <div class="left">

        <div class="logo">
            ✨
        </div>

        <h1>BLANKO</h1>

        <p>
            Create beautiful documents effortlessly.
            <br><br>
            Join students, educators and professionals
            who create resumes, certificates, invoices
            and more with a single click.
        </p>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right">

        <h2>Create Account</h2>

        <form action="/register" method="post">

            <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required>

            <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

            <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="bottom">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </div>

    </div>

</div>

<script>

setTimeout(function(){

    const toast =
            document.querySelector(".toast");

    if(toast){

        toast.remove();

    }

},3500);

</script>

</body>

</html>
